# Sample workflow for building and deploying a Hugo site and Next.js project to GitHub Pages
name: Deploy Hugo and Next.js site to Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/**'

  # This repo only pushes when the portfolio/blog content itself changes, but
  # the résumé button always fetches whatever is *currently* latest over in
  # nurkanatgg/resume — a repo this one has no push-based trigger for. Without
  # this, a new résumé release sits unfetched until someone happens to touch
  # this repo too (see: the button silently going ~6 weeks stale between the
  # Jul 29 and Sep 2026 deploys). Daily rebuild keeps the button self-healing.
  schedule:
    - cron: '17 4 * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job for Hugo and Next.js
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.136.5
    steps:
      # Install Hugo CLI
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      # Use a pinned upstream release instead of depending on the Snap store.
      - name: Install Dart Sass
        env:
          DART_SASS_VERSION: 1.108.2
          DART_SASS_SHA256: 32d2eb5b83cbc180fce9657ff3c57401a9006c59eccfe0bfdde0aa755a66d42f
        run: |
          archive="${RUNNER_TEMP}/dart-sass.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
            --output "$archive"
          echo "${DART_SASS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/dart-sass" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/dart-sass/sass" --version

      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Setup Pages
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Install Node.js dependencies for Next.js
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Install Next.js dependencies
        working-directory: ./portfolio
        run: npm ci

      - name: Create Directories for Build Artifacts
        run: |
          mkdir public
          mkdir public/blog

      # The résumé is built and released by nurkanatgg/resume's own CI.
      # Pull the current release asset into portfolio/public so the site serves
      # it at /resume.pdf and can never ship a stale copy. The résumé repo is
      # private, so this needs the RESUME_REPO_TOKEN secret: a fine-grained PAT
      # with contents:read on nurkanatgg/resume.
      - name: Fetch résumé from resume repo release
        env:
          GH_TOKEN: ${{ secrets.RESUME_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RESUME_REPO_TOKEN is not set — cannot fetch resume.pdf. Add a fine-grained PAT with contents:read on nurkanatgg/resume."
            exit 1
          fi
          gh release download --repo nurkanatgg/resume \
            --pattern 'resume.pdf' \
            --output portfolio/public/resume.pdf --clobber
          # Fail loudly rather than deploying a site whose Résumé button 404s.
          test -s portfolio/public/resume.pdf
          head -c 4 portfolio/public/resume.pdf | grep -q '%PDF' \
            || { echo "::error::Downloaded resume.pdf is not a PDF"; exit 1; }
          echo "Fetched resume.pdf ($(stat -c%s portfolio/public/resume.pdf) bytes)"

      # Build Next.js project
      - name: Build Next.js
        working-directory: ./portfolio
        env:
          NEXT_PUBLIC_BASE_PATH: "/"
        run: |
          npm run build
          cp -r out/* ../public/

      # Install Node.js dependencies for Hugo (if applicable)
      - name: Install Node.js dependencies for Hugo
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"

      # Build Hugo site
      - name: Build with Hugo
        working-directory: ./blog
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Almaty
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/blog"
          cp -r out/* ../public/blog

      # Upload artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
